<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Distancias 11.178</title>
<meta name="description" content="Zonas de exclusión y amortiguamiento de la Ley 11.178 de Entre Ríos sobre el lote, con hectáreas afectadas y KML para el drone.">
<meta name="theme-color" content="#1f5f4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <button type="button" class="brand" data-go="lista" aria-label="Mis lotes">
      <strong>Distancias 11.178</strong>
      <span id="loteTitulo">Entre Ríos</span>
    </button>
    <a class="help" href="manual.html" title="Manual de uso">? Ayuda</a>
    <nav class="steps" id="steps" aria-label="Pasos">
      <button type="button" data-go="lote"><i>1</i><span>Lote</span></button>
      <button type="button" data-go="sens"><i>2</i><span>Sensibles</span></button>
      <button type="button" data-go="aplic"><i>3</i><span>Aplicación</span></button>
      <button type="button" data-go="res"><i>4</i><span>Resultado</span></button>
    </nav>
  </header>

  <div class="mapwrap">
    <div id="map" aria-label="Mapa satelital"></div>
    <div class="maptools">
      <button type="button" class="mt" data-act="base" title="Cambiar fondo">Fondo</button>
      <button type="button" class="mt" data-act="locate" title="Ir a mi ubicación">Mi ubicación</button>
    </div>
    <div class="drawhint" id="drawhint" hidden></div>
    <div class="drawbar-map" id="drawbar" hidden></div>
  </div>

  <aside class="sheet" id="sheet">
    <button type="button" class="grip" id="grip" aria-label="Achicar o agrandar el panel"><span></span></button>
    <div id="panel"></div>
  </aside>
</div>

<dialog id="importDlg">
  <form method="dialog">
    <h2>¿Qué es cada elemento del archivo?</h2>
    <div id="importList"></div>
    <div class="row">
      <button value="cancel" class="btn ghost">Cancelar</button>
      <button value="ok" class="btn">Agregar</button>
    </div>
  </form>
</dialog>

<section class="print-only" id="printBox"></section>
<input type="file" id="fileIn" accept=".kml,.geojson,.json,application/vnd.google-earth.kml+xml,application/geo+json,application/json" hidden>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
